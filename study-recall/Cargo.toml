[workspace]
resolver = "2"
members = ["crates/study-core", "src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["Study Recall"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
rand = "0.8"
base64 = "0.22"
unicode-normalization = "0.1"
wait-timeout = "0.2"
tempfile = "=3.10.1"
