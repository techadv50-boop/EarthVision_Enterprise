name: Package WebCrawler Enterprise (Windows)

on:
  push:
    paths:
      - "webcrawler_enterprise/**"
      - ".github/workflows/package-webcrawler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build portable zip
        run: |
          chmod +x webcrawler_enterprise/scripts/make_portable_zip.sh
          webcrawler_enterprise/scripts/make_portable_zip.sh webcrawler_enterprise/dist

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: WebCrawlerEnterprise-Portable
          path: webcrawler_enterprise/dist/WebCrawlerEnterprise-Portable.zip
          if-no-files-found: error

  windows-standalone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: webcrawler_enterprise
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Playwright Chromium into local folder
        working-directory: webcrawler_enterprise
        shell: pwsh
        run: |
          $browserRoot = Join-Path (Get-Location) "ms-playwright"
          New-Item -ItemType Directory -Force -Path $browserRoot | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = $browserRoot
          python -m playwright install chromium
          if (-not (Get-ChildItem $browserRoot -ErrorAction SilentlyContinue)) {
            throw "Playwright browsers were not installed into $browserRoot"
          }

      - name: Build with PyInstaller
        working-directory: webcrawler_enterprise
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path (Get-Location) "ms-playwright"
          pyinstaller --noconfirm webcrawler_enterprise.spec

      - name: Stage standalone package
        working-directory: webcrawler_enterprise
        shell: pwsh
        run: |
          $stage = "dist/WebCrawlerEnterprise-Standalone"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # PyInstaller output
          Copy-Item -Recurse "dist/WebCrawlerEnterprise/*" $stage

          # Bundled Chromium for Playwright fallback (no python/playwright install needed)
          Copy-Item -Recurse "ms-playwright" (Join-Path $stage "ms-playwright")

          # Double-click launcher + docs
          Copy-Item "scripts/Start_WebCrawlerEnterprise.bat" (Join-Path $stage "Start WebCrawler Enterprise.bat")
          Copy-Item "README_STANDALONE.txt" (Join-Path $stage "README_START_HERE.txt")
          Copy-Item "README.md" $stage -ErrorAction SilentlyContinue

          @"
          WebCrawler Enterprise - Standalone

          Double-click: Start WebCrawler Enterprise.bat

          Login: admin / admin
          Master reset: NTZHSS

          No Python or VS Code required.
          "@ | Set-Content -Path (Join-Path $stage "OPEN_ME.txt") -Encoding UTF8

      - name: Zip standalone package
        working-directory: webcrawler_enterprise
        shell: pwsh
        run: |
          if (Test-Path "dist/WebCrawlerEnterprise-Standalone-Windows.zip") {
            Remove-Item "dist/WebCrawlerEnterprise-Standalone-Windows.zip" -Force
          }
          Compress-Archive -Path "dist/WebCrawlerEnterprise-Standalone\*" -DestinationPath "dist/WebCrawlerEnterprise-Standalone-Windows.zip" -Force
          Get-Item "dist/WebCrawlerEnterprise-Standalone-Windows.zip" | Format-List Name, Length

      - name: Upload standalone Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WebCrawlerEnterprise-Standalone-Windows
          path: webcrawler_enterprise/dist/WebCrawlerEnterprise-Standalone-Windows.zip
          if-no-files-found: error
          retention-days: 30
