name: Package WebCrawler Enterprise (Windows)

on:
  push:
    paths:
      - "webcrawler_enterprise/**"
      - ".github/workflows/package-webcrawler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build portable zip
        run: |
          chmod +x webcrawler_enterprise/scripts/make_portable_zip.sh
          webcrawler_enterprise/scripts/make_portable_zip.sh webcrawler_enterprise/dist

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: WebCrawlerEnterprise-Portable
          path: webcrawler_enterprise/dist/WebCrawlerEnterprise-Portable.zip
          if-no-files-found: error

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: webcrawler_enterprise
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Playwright Chromium
        working-directory: webcrawler_enterprise
        run: python -m playwright install chromium

      - name: Build with PyInstaller
        working-directory: webcrawler_enterprise
        run: pyinstaller --noconfirm webcrawler_enterprise.spec

      - name: Stage Windows package
        working-directory: webcrawler_enterprise
        shell: pwsh
        run: |
          $stage = "dist/WebCrawlerEnterprise-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "dist/WebCrawlerEnterprise/*" $stage
          Copy-Item "START_HERE.txt" $stage -ErrorAction SilentlyContinue
          Copy-Item "README.md" $stage -ErrorAction SilentlyContinue
          @"
          WebCrawler Enterprise (Windows build)

          1. Unzip this folder
          2. Run WebCrawlerEnterprise.exe
          3. Login: admin / admin (change password on first login)
          4. Master reset code: NTZHSS

          Note: If Chromium is missing for Playwright, install with:
            playwright install chromium
          or use the Portable package with Setup.bat.
          "@ | Set-Content -Path "$stage/README_WINDOWS.txt"

      - name: Zip Windows package
        working-directory: webcrawler_enterprise
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/WebCrawlerEnterprise-Windows\*" -DestinationPath "dist/WebCrawlerEnterprise-Windows.zip" -Force

      - name: Upload Windows exe package
        uses: actions/upload-artifact@v4
        with:
          name: WebCrawlerEnterprise-Windows
          path: webcrawler_enterprise/dist/WebCrawlerEnterprise-Windows.zip
          if-no-files-found: error
