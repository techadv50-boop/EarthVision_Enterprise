name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Test
        run: |
          export DATABASE_URL=sqlite+aiosqlite:///./test.db
          export SECRET_KEY=ci-test-secret-key-at-least-32-characters
          # Prefer full suite; never skip Stage C tool-protection modules.
          pytest app/tests -q
      - name: Tool protection subset (hard fail)
        run: |
          export DATABASE_URL=sqlite+aiosqlite:///./test.db
          export SECRET_KEY=ci-test-secret-key-at-least-32-characters
          pytest -q \
            app/tests/tools/test_manifest_integrity.py \
            app/tests/tools/test_true_color_poc.py \
            app/tests/tools/test_ship_detection_canary.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run build
