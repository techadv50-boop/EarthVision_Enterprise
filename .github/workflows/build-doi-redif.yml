name: Build DOI REDIF Converter

on:
  push:
    branches:
      - cursor/doi-redif-converter-01fe
    paths:
      - "doi-redif-converter/**"
      - ".github/workflows/build-doi-redif.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DOI_REDIF_Converter-windows
          - os: macos-latest
            artifact: DOI_REDIF_Converter-macos
          - os: ubuntu-latest
            artifact: DOI_REDIF_Converter-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: doi-redif-converter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: doi-redif-converter
        run: python build_standalone.py

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: doi-redif-converter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/DOI_URL_REDIF_Standalone.exe release/
          Copy-Item packaging/Run_Standalone.bat release/
          Copy-Item packaging/READ_ME_FIRST.txt release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        working-directory: doi-redif-converter
        run: |
          mkdir -p release
          cp dist/DOI_URL_REDIF_Standalone release/
          chmod +x release/DOI_URL_REDIF_Standalone
          cp packaging/READ_ME_FIRST.txt release/
          cp README.md release/
          zip -r "${{ matrix.artifact }}.zip" release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: doi-redif-converter/${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
