name: Tool Protection

# Stage C — protect approved tools (true_color) and unrelated canary (ship_detection).
# Does NOT deploy. Full-app deploy model unchanged.
on:
  push:
    branches: [cursor/scene-download-eye-5d6d, cursor/**]
  pull_request:

concurrency:
  group: tool-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-and-guards:
    name: Manifest + approved-path guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tool manifest vs catalog
        run: python scripts/tools/check_manifest.py
      - name: Guard approved tool paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/tools/check_approved_guard.py

  approved-and-canary-tests:
    name: true_color PoC + ship_detection canary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Run Stage C/E1/E1.5/E1.7 protection tests (hard fail)
        run: |
          export DATABASE_URL=sqlite+aiosqlite:///./test.db
          export SECRET_KEY=ci-test-secret-key-at-least-32-characters
          # No soft fallback — approved/canary/pack regressions must fail the job.
          pytest -q \
            app/tests/tools/test_manifest_integrity.py \
            app/tests/tools/test_true_color_poc.py \
            app/tests/tools/test_true_color_pack_e1.py \
            app/tests/tools/test_true_color_pack_e15_reliability.py \
            app/tests/tools/test_true_color_pack_e17_integration.py \
            app/tests/tools/test_ship_detection_canary.py \
            app/tests/test_composite_band_recipes.py \
            app/tests/test_optical_ship_detection.py

  e19a-deploy-safety:
    name: E1.9A deploy safety gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps for overlay + trust tests
        run: |
          python -m pip install -U pip
          python -m pip install pyyaml -r backend/requirements.txt
          python -m venv backend/.venv
          backend/.venv/bin/pip install -U pip pyyaml -r backend/requirements.txt
      - name: Run E1.9A safety suite + deploy unit tests
        run: |
          chmod +x scripts/tests/test_e19a_safety.sh scripts/tests/test_deploy_sateye_live.sh \
            scripts/deploy_verify_ci_gate.sh scripts/deploy_capture_preflight.sh \
            scripts/deploy_merge_compose_overlay.py
          bash scripts/tests/test_e19a_safety.sh
          bash scripts/tests/test_deploy_sateye_live.sh
