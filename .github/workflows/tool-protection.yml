name: Tool Protection

# Stage C — protect approved tools (true_color) and unrelated canary (ship_detection).
# Does NOT deploy. Full-app deploy model unchanged.
on:
  push:
    branches: [cursor/scene-download-eye-5d6d, cursor/**]
  pull_request:

concurrency:
  group: tool-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-and-guards:
    name: Manifest + approved-path guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tool manifest vs catalog
        run: python scripts/tools/check_manifest.py
      - name: Guard approved tool paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/tools/check_approved_guard.py

  approved-and-canary-tests:
    name: true_color PoC + ship_detection canary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Run Stage C protection tests (hard fail)
        run: |
          export DATABASE_URL=sqlite+aiosqlite:///./test.db
          export SECRET_KEY=ci-test-secret-key-at-least-32-characters
          # No soft fallback — approved/canary regressions must fail the job.
          pytest -q \
            app/tests/tools/test_manifest_integrity.py \
            app/tests/tools/test_true_color_poc.py \
            app/tests/tools/test_ship_detection_canary.py \
            app/tests/test_composite_band_recipes.py \
            app/tests/test_optical_ship_detection.py
