[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-relay"
version = "0.1.0"
description = "Poll shared-hosting drop folders over SFTP and forward new files to other servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.5,<5",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
