worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 512m;

  # Docker embedded DNS — re-resolve after container recreate (avoids stale
  # upstream IPs → Cloudflare 502 on / while /health still works).
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    location /api/ {
      set $backend_upstream backend:8000;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Keep Cloudflare (<100s default) and long EO jobs from truncating mid-response
      proxy_connect_timeout 30s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }

    location /docs {
      set $backend_upstream backend:8000;
      proxy_pass http://$backend_upstream;
      proxy_read_timeout 60s;
    }

    location /openapi.json {
      set $backend_upstream backend:8000;
      proxy_pass http://$backend_upstream;
      proxy_read_timeout 60s;
    }

    location /health {
      set $backend_upstream backend:8000;
      proxy_pass http://$backend_upstream;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location / {
      set $frontend_upstream frontend:80;
      proxy_pass http://$frontend_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
