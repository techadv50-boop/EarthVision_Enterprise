# P2A local/preview ONLY — additive overlay for sateye-preview.
# Does NOT modify production Compose / Dokploy / sateye.xdgen.com.
#
# Usage:
#   docker compose -p sateye-preview \
#     -f docker-compose.preview.yml \
#     -f tools/plugins/worker/compose.preview.yml \
#     --env-file .env.preview up -d --build plugin_worker backend
#
# Safety:
# - Separate project name (sateye-preview)
# - Worker has no DATABASE_URL / SECRET_KEY
# - tool_packs mount is read-only
# - no-new-privileges, cap_drop ALL, non-root, read_only rootfs

services:
  plugin_worker:
    build:
      context: ./tools/plugins/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      EV_ARTIFACTS_ROOT: /tool_packs/artifacts
      EV_PLUGIN_WORKER_PORT: "8091"
      EV_PLUGIN_WORKER_TIMEOUT_SEC: "5"
      EV_PLUGIN_WORKER_READONLY: "1"
      DATABASE_URL: ""
      SECRET_KEY: ""
      MASTER_PASSWORD: ""
      ADMIN_PASSWORD: ""
      DOCKER_HOST: ""
    volumes:
      - sateye_preview_tool_packs:/tool_packs:ro
    networks:
      - sateye_preview_net
    expose:
      - "8091"
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  backend:
    environment:
      EV_PLUGIN_WORKER_URL: http://plugin_worker:8091
      EV_PLUGIN_WORKER_REQUIRED: "1"
    depends_on:
      plugin_worker:
        condition: service_healthy
