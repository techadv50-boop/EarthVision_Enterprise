<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Hello Plugin 1.1.0</title>
  <style>
    :root {
      --fg: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #047857;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 12px/1.45 system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    .wrap { padding: 10px 12px; }
    h1 { margin: 0; font-size: 13px; font-weight: 650; }
    .meta { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .msg { margin-top: 8px; }
    ul { margin: 8px 0 0; padding: 0; list-style: none; }
    li {
      display: flex;
      justify-content: space-between;
      padding: 4px 8px;
      margin-top: 4px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .err { color: #b91c1c; margin-top: 8px; }
    .note { margin-top: 8px; color: var(--muted); font-size: 10px; }
    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #d1fae5;
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap" id="root">
    <h1 id="title">Demo Hello</h1>
    <div class="meta" id="meta">Loading…</div>
    <div class="badge" id="badge">sandboxed iframe</div>
    <div class="msg" id="msg"></div>
    <ul id="points"></ul>
    <div class="note" id="note"></div>
    <div class="err" id="err" hidden></div>
  </div>
  <script src="./plugin.js"></script>
</body>
</html>
