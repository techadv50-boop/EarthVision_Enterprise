[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webcrawler-enterprise"
version = "1.0.0"
description = "Professional Windows desktop web crawler for contact extraction and document download"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "phonenumbers>=8.13.0",
    "tldextract>=5.1.0",
]

[project.scripts]
webcrawler-enterprise = "webcrawler.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["webcrawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]