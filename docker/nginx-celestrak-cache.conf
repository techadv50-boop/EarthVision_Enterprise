proxy_cache_path /var/cache/nginx/celestrak levels=1:2 keys_zone=celestrak:1m max_size=30m inactive=6h use_temp_path=off;

# The refusal body is a few hundred bytes. A real catalog is megabytes.
# Do not store the refusal in place of the catalog.
map $upstream_http_content_length $celestrak_nocache {
    default 0;
    ""      1;
    "~^[0-9]{1,5}$" 1;
}
