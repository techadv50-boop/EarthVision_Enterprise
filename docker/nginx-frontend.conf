server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite hashed assets are safe to cache. index.html must not be, or browsers
    # keep an old Sign In bundle after Dokploy rebuilds.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # FastAPI slash redirects use Location: http://... because this server
        # listens on port 80 behind Cloudflare. Strip the slash instead.
        rewrite ^(/api/.+)/$ $1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # $scheme is http inside this container — never use it for redirects.
        proxy_redirect http:// https://;
        proxy_redirect http://$host/ https://$host/;
        proxy_read_timeout 300s;
    }
}
