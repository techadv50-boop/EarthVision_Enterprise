server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml;
    gzip_vary on;

    location /boundaries/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Live active-satellite catalog. Same-origin so the browser can read Celestrak.
    # Celestrak rejects a second GROUP=active download from this server for about
    # two hours, so keep the last full catalog and serve it on that refusal.
    location /celestrak/ {
        proxy_pass https://celestrak.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host celestrak.org;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_cache celestrak;
        proxy_cache_key $scheme$proxy_host$request_uri;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 130s;
        proxy_cache_valid 200 3h;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_no_cache $celestrak_nocache;
    }
}
