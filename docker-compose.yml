services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: earthvision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: earthvision
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthvision -d earthvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: '["https://sateye.xdgen.com"]'
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      IMAGERY_CACHE_DIR: /data/cache
      IMAGERY_DIR: /data/imagery
      UPLOADS_DIR: /data/uploads
      LOGS_DIR: /data/logs
      COPERNICUS_USERNAME: ${COPERNICUS_USERNAME}
      COPERNICUS_PASSWORD: ${COPERNICUS_PASSWORD}
      CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - ./cache:/data/cache
      - ./imagery:/data/imagery
      - ./uploads:/data/uploads
      - ./logs:/data/logs
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
