services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: earthvision
      POSTGRES_PASSWORD: earthvision
      POSTGRES_DB: earthvision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthvision -d earthvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://earthvision:earthvision@db:5432/earthvision
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: earthvision-compose-secret-change-me-32chars!
      CORS_ORIGINS: '["http://localhost","http://localhost:5173","http://localhost:80"]'
      ADMIN_EMAIL: admin@earthvision.io
      ADMIN_PASSWORD: EarthVision@Admin2024!
      IMAGERY_CACHE_DIR: /data/cache
      IMAGERY_DIR: /data/imagery
      UPLOADS_DIR: /data/uploads
      LOGS_DIR: /data/logs
    volumes:
      - ./cache:/data/cache
      - ./imagery:/data/imagery
      - ./uploads:/data/uploads
      - ./logs:/data/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
