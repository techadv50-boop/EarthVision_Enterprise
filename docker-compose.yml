version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: earthvision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: earthvision
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U earthvision']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - '8200:8000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 'false'
      CORS_ORIGINS: '["https://citation.xdgen.com","https://xdgen.com","https://www.xdgen.com","http://localhost","http://localhost:5173"]'
      OPERATOR_EMAIL: citation@xdgen.com
      OPERATOR_USERNAME: citation@xdgen.com
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD}
      MASTER_RESET_PASSWORD: ${MASTER_RESET_PASSWORD}
      PUBLIC_HOST: citation.xdgen.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - ./cache:/app/cache
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - '8201:80'
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - '8202:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend


volumes:
  pgdata:
    name: dokploy_citation_pgdata
