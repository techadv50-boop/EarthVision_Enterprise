version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: earthvision
      POSTGRES_PASSWORD: earthvision
      POSTGRES_DB: earthvision
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U earthvision']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://earthvision:earthvision@db:5432/earthvision
      SECRET_KEY: ${SECRET_KEY:-production-secret-key-change-me-min-32-chars-long}
      DEBUG: 'false'
      CORS_ORIGINS: '["https://citation.xdgen.com","https://xdgen.com","https://www.xdgen.com","http://localhost","http://localhost:5173"]'
      OPERATOR_EMAIL: citation@xdgen.com
      OPERATOR_USERNAME: citation@xdgen.com
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-pak123}
      MASTER_RESET_PASSWORD: ${MASTER_RESET_PASSWORD:-NTZHSS}
      PUBLIC_HOST: citation.xdgen.com
    volumes:
      - ./cache:/app/cache
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - '80:80'
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  pgdata:
